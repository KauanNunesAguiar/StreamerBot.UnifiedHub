<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações do Spotify - StreamerBot Unified Hub</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #181818;
            --item-bg: #202020;
            --item-bg-hover: #282828;
            --input-bg: #282828;
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --text-main: #FFFFFF;
            --text-sub: #A7A7A7;
            --error: #E91429;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .step-indicator {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            color: var(--primary);
            font-size: 42px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 14px;
        }

        .error {
            background-color: rgba(233, 20, 41, 0.15);
            border: 1px solid var(--error);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--primary);
            margin: 20px 0 12px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .playlist-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            padding-right: 4px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--item-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .playlist-item:hover {
            background-color: var(--item-bg-hover);
        }

        .playlist-item input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .playlist-item:has(input:checked) {
            border-color: var(--primary);
            background-color: var(--item-bg-hover);
        }

        .playlist-thumb,
        .playlist-thumb-placeholder {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .playlist-thumb-placeholder {
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .playlist-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .playlist-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-tracks {
            font-size: 12px;
            color: var(--text-sub);
        }

        .messages-container {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input[type="number"],
        .message-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
        }

        .message-group {
            margin-bottom: 16px;
        }

        .message-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .message-group textarea {
            resize: vertical;
        }

        .form-group input:focus,
        .message-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .vars-help {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .vars-help code {
            background: #282828;
            padding: 2px 5px;
            border-radius: 4px;
            color: #1ed760;
            font-family: monospace;
            font-size: 11px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: scale(1.02);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="step-indicator">Passo 2 de 2</div>
        <div class="header">
            <div class="logo-icon">🎵</div>
            <h1>Configurações do Spotify</h1>
            <p>Escolha a playlist das lives e personalize as respostas no chat</p>
        </div>

        {{ERROR_SECTION}}

        <form method="POST">
            <div class="section-title">Playlist de Lives</div>
            <div class="playlist-list">
                {{PLAYLIST_ITEMS}}
            </div>

            <div class="section-title">Regras de Reprodução</div>
            <div class="form-group">
                <label for="voteSkipThreshold">Votos para Pular Música (VoteSkip)</label>
                <input type="number" id="voteSkipThreshold" name="voteSkipThreshold" min="1" max="100"
                    value="{{VOTE_SKIP_THRESHOLD}}">
            </div>

            <div class="section-title">Mensagens do Chat</div>
            <div class="messages-container">
                {{MESSAGE_INPUTS}}
            </div>

            <button type="submit" class="btn-submit">Salvar e Concluir</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="cancel" style="color: var(--text-sub); text-decoration: none; font-size: 13px;">Pular esta
                etapa</a>
        </div>
    </div>
</body>

</html>
